<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes, maximum-scale=1.0">
    <title>Active Packers & Movers | Lead Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f5f7fb;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            padding-bottom: 70px;
        }

        .navbar-modern {
            background: linear-gradient(135deg, #0b2b5c 0%, #1a4a8b 100%);
            padding: 0.5rem 0;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .brand-icon {
            font-size: 1.2rem;
            margin-right: 6px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            margin-bottom: 10px;
        }

        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 6px 3px;
            text-align: center;
            box-shadow: 0 1px 2px rgba(0,0,0,0.03);
            cursor: pointer;
            transition: all 0.2s;
        }

        .stat-card:active {
            transform: scale(0.98);
        }

        .stat-card i {
            font-size: 1rem;
            margin-bottom: 2px;
            display: block;
        }

        .stat-label {
            font-size: 8px;
            font-weight: 700;
            text-transform: uppercase;
            color: #64748b;
        }

        .stat-number {
            font-size: 1.1rem;
            font-weight: 800;
            line-height: 1.1;
            color: #0a2540;
        }

        .action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 8px 0 6px;
        }

        .btn-compact {
            border-radius: 30px;
            padding: 4px 12px;
            font-weight: 600;
            font-size: 0.7rem;
        }

        .filter-row-horizontal {
            display: flex;
            gap: 6px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        .search-box-horizontal {
            flex: 2;
            position: relative;
            min-width: 120px;
        }

        .search-box-horizontal i {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 0.75rem;
            color: #94a3b8;
        }

        .search-box-horizontal input {
            width: 100%;
            padding: 6px 8px 6px 28px;
            border-radius: 20px;
            border: 1px solid #e2e8f0;
            background: white;
            font-size: 0.7rem;
        }

        .status-select-horizontal {
            flex: 1;
            min-width: 100px;
        }

        .status-select-horizontal select {
            width: 100%;
            padding: 6px 8px;
            border-radius: 20px;
            background: white;
            border: 1px solid #e2e8f0;
            font-size: 0.7rem;
            font-weight: 500;
        }

        .calendar-trigger {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            padding: 5px 10px;
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            white-space: nowrap;
        }

        .calendar-trigger i {
            font-size: 0.75rem;
            color: #1a4a8b;
        }

        .calendar-trigger span {
            font-size: 0.7rem;
            font-weight: 500;
            color: #0a2540;
        }

        /* Ultra Compact Lead Cards - Minimal Height */
        .lead-card {
            background: white;
            border-radius: 12px;
            margin-bottom: 6px;
            padding: 8px 10px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.03);
            border: 1px solid #edf2f7;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .lead-card:active {
            transform: scale(0.98);
        }

        .lead-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }

        .customer-name {
            font-weight: 700;
            font-size: 0.8rem;
            color: #0a2540;
            display: flex;
            align-items: center;
            gap: 4px;
            flex-wrap: wrap;
        }

        .badge-source {
            background: #eef2ff;
            color: #1e4a8a;
            font-size: 0.55rem;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 30px;
        }

        .status-chip {
            display: inline-flex;
            align-items: center;
            padding: 2px 8px;
            border-radius: 30px;
            font-size: 0.6rem;
            font-weight: 700;
        }

        .phone-group {
            display: flex;
            gap: 6px;
            align-items: center;
            margin: 4px 0;
            flex-wrap: wrap;
        }

        .phone-link {
            text-decoration: none;
            font-weight: 600;
            background: #f1f5f9;
            padding: 3px 8px;
            border-radius: 25px;
            font-size: 0.65rem;
            display: inline-flex;
            align-items: center;
            gap: 3px;
        }

        .whatsapp-link {
            background: #dcfce7;
            color: #0e6b2b;
        }

        .location-row {
            font-size: 0.6rem;
            background: #f8fafc;
            padding: 4px 6px;
            border-radius: 10px;
            margin: 4px 0;
            display: flex;
            align-items: center;
            gap: 4px;
            flex-wrap: wrap;
        }

        .cost-badge {
            font-weight: 700;
            background: #fff7ed;
            padding: 2px 6px;
            border-radius: 20px;
            font-size: 0.65rem;
        }

        .date-badge {
            background: #e7f1ff;
            border-radius: 20px;
            padding: 2px 6px;
            font-size: 0.6rem;
            font-weight: 600;
        }

        /* Expand Button - Bada aur visible */
        .expand-btn {
            background: linear-gradient(135deg, #0b2b5c 0%, #1a4a8b 100%);
            border: none;
            border-radius: 25px;
            padding: 6px 12px;
            margin-top: 6px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 0.7rem;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: all 0.2s;
        }

        .expand-btn i {
            font-size: 0.8rem;
        }

        .expand-btn:active {
            transform: scale(0.97);
        }

        /* Detailed Modal Styles */
        .detailed-modal .modal-content {
            border-radius: 28px;
            overflow: hidden;
        }

        .detailed-modal .modal-header {
            background: linear-gradient(135deg, #0b2b5c 0%, #1a4a8b 100%);
            color: white;
            padding: 20px 24px;
            border: none;
        }

        .detailed-modal .modal-body {
            padding: 24px;
            max-height: 70vh;
            overflow-y: auto;
        }

        .detail-section {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #edf2f7;
        }

        .detail-label {
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            color: #64748b;
            margin-bottom: 5px;
        }

        .detail-value {
            font-size: 1rem;
            font-weight: 600;
            color: #0a2540;
        }

        .detail-value-large {
            font-size: 1.2rem;
            font-weight: 800;
            color: #0b2b5c;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .modal-action-buttons {
            display: flex;
            gap: 12px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .modal-action-btn {
            flex: 1;
            padding: 12px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border: none;
            transition: all 0.2s;
        }

        .modal-action-btn:active {
            transform: scale(0.97);
        }

        .btn-edit-modal {
            background: #0b2b5c;
            color: white;
        }

        .btn-call-modal {
            background: #25D366;
            color: white;
        }

        .btn-whatsapp-modal {
            background: #128C7E;
            color: white;
        }

        .btn-delete-modal {
            background: #dc3545;
            color: white;
        }

        /* Call Logs inside modal */
        .call-logs-container {
            background: #f8fafc;
            border-radius: 16px;
            padding: 12px;
            max-height: 200px;
            overflow-y: auto;
        }

        .call-log-item-modal {
            background: white;
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 12px;
            border-left: 3px solid #1a4a8b;
        }

        .call-log-time-modal {
            font-size: 0.65rem;
            color: #64748b;
            margin-bottom: 4px;
        }

        .call-log-note-modal {
            font-size: 0.8rem;
            color: #0a2540;
        }

        .new-call-input {
            margin-top: 12px;
        }

        .toast-notification {
            position: fixed;
            top: 60px;
            right: 10px;
            left: 10px;
            z-index: 9999;
            animation: slideDown 0.2s ease-out;
        }

        @keyframes slideDown {
            from {
                transform: translateY(-100%);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .fab-add {
            position: fixed;
            bottom: 15px;
            right: 15px;
            background: linear-gradient(135deg, #0b2b5c 0%, #1a4a8b 100%);
            width: 48px;
            height: 48px;
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 3px 10px rgba(0,0,0,0.2);
            z-index: 1050;
            border: none;
            color: white;
            font-size: 1.4rem;
            cursor: pointer;
        }

        @media (min-width: 768px) {
            .fab-add {
                display: none;
            }
            .stats-grid {
                gap: 12px;
            }
            .stat-card {
                padding: 10px;
            }
            .stat-number {
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>

<div id="toastContainer" class="toast-notification"></div>

<nav class="navbar-modern">
    <div class="container">
        <div class="d-flex align-items-center text-white">
            <i class="bi bi-truck brand-icon"></i>
            <div>
                <span class="fw-bold" style="font-size: 0.9rem;">Active Packers & Movers</span>
                <small class="d-block" style="font-size: 0.55rem; opacity: 0.9;">LEAD MANAGER</small>
            </div>
        </div>
        <div>
            <span class="badge bg-white text-dark px-2 py-1 rounded-pill" style="font-size: 0.55rem;">
                <i class="bi bi-cloud-check"></i> Live
            </span>
        </div>
    </div>
</nav>

<div class="container mt-2">
    <div class="stats-grid" id="statsContainer">
        <div class="stat-card"><i class="bi bi-people-fill text-primary"></i><div class="stat-number">0</div><div class="stat-label">LEADS</div></div>
        <div class="stat-card"><i class="bi bi-google text-danger"></i><div class="stat-number">0</div><div class="stat-label">ADSENSE</div></div>
        <div class="stat-card"><i class="bi bi-building text-info"></i><div class="stat-number">0</div><div class="stat-label">JUSTDIAL</div></div>
        <div class="stat-card"><i class="bi bi-whatsapp text-success"></i><div class="stat-number">0</div><div class="stat-label">WHATSAPP</div></div>
    </div>

    <div class="action-bar">
        <h6 class="m-0 fw-bold" style="font-size: 0.75rem;">
            <i class="bi bi-people-fill me-1"></i> <span id="leadCountSpan">0</span> Leads
        </h6>
        <div class="d-flex gap-2">
            <a href="/export_excel" class="btn btn-outline-success btn-compact"><i class="bi bi-file-earmark-spreadsheet"></i> Export</a>
            <button class="btn btn-primary btn-compact d-none d-md-block" data-bs-toggle="modal" data-bs-target="#addLeadModal"><i class="bi bi-plus-lg"></i> Add</button>
        </div>
    </div>

    <div class="filter-row-horizontal">
        <div class="search-box-horizontal">
            <i class="bi bi-search"></i>
            <input type="text" id="globalSearch" placeholder="Search...">
        </div>
        
        <div class="status-select-horizontal">
            <select id="statusFilterGlobal">
                <option value="all">All Status</option>
                {% for status in statuses %}
                <option value="{{ status }}">{{ status }}</option>
                {% endfor %}
            </select>
        </div>
        
        <div class="calendar-trigger" id="calendarTrigger">
            <i class="bi bi-calendar-range"></i>
            <span id="calendarLabel">Date</span>
            <i class="bi bi-chevron-down"></i>
        </div>
    </div>

    <div id="leadsListContainer"></div>
</div>

<button class="fab-add" data-bs-toggle="modal" data-bs-target="#addLeadModal">
    <i class="bi bi-plus-lg"></i>
</button>

<!-- Add Lead Modal -->
<div class="modal fade" id="addLeadModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h6 class="modal-title m-0"><i class="bi bi-plus-circle me-2"></i> New Lead</h6>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <form id="addLeadForm">
                <div class="modal-body">
                    <div class="row g-2">
                        <div class="col-12"><label class="form-label">Name *</label><input type="text" name="name" class="form-control form-control-sm" required></div>
                        <div class="col-12"><label class="form-label">Phone *</label><input type="tel" name="phone" class="form-control form-control-sm" required></div>
                        <div class="col-12"><label class="form-label">Source</label><select name="source" class="form-select form-select-sm">{% for src in sources %}<option>{{ src }}</option>{% endfor %}</select></div>
                        <div class="col-12"><label class="form-label">Status</label><select name="status" class="form-select form-select-sm">{% for st in statuses %}<option>{{ st }}</option>{% endfor %}</select></div>
                        <div class="col-6"><label class="form-label">From</label><input type="text" name="from_location" class="form-control form-control-sm"></div>
                        <div class="col-6"><label class="form-label">To</label><input type="text" name="to_location" class="form-control form-control-sm"></div>
                        <div class="col-6"><label class="form-label">Estimate (₹)</label><input type="number" name="cost_estimate" class="form-control form-control-sm" value="0"></div>
                        <div class="col-6"><label class="form-label">Shifting Date</label><input type="date" name="shifting_date" class="form-control form-control-sm"></div>
                        <div class="col-12"><label class="form-label">Notes</label><textarea name="notes" class="form-control form-control-sm" rows="2"></textarea></div>
                    </div>
                </div>
                <div class="modal-footer py-2">
                    <button type="button" class="btn btn-sm btn-light" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-sm btn-primary px-3">Save Lead</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Edit Modal (Keep for compatibility) -->
<div class="modal fade" id="editModalGlobal" tabindex="-1">
    <div class="modal-dialog modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h6 class="modal-title m-0"><i class="bi bi-pencil-square me-2"></i> Edit Lead</h6>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <form id="editFormDynamic">
                <input type="hidden" name="lead_id" id="edit_lead_id">
                <div class="modal-body">
                    <div class="row g-2">
                        <div class="col-12"><label class="form-label">Name *</label><input type="text" name="name" id="edit_name" class="form-control form-control-sm" required></div>
                        <div class="col-12"><label class="form-label">Phone *</label><input type="tel" name="phone" id="edit_phone" class="form-control form-control-sm" required></div>
                        <div class="col-12"><label class="form-label">Alt Phone</label><input type="tel" name="alternate_phone" id="edit_alt_phone" class="form-control form-control-sm"></div>
                        <div class="col-6"><label class="form-label">Source</label><select name="source" id="edit_source" class="form-select form-select-sm">{% for src in sources %}<option>{{ src }}</option>{% endfor %}</select></div>
                        <div class="col-6"><label class="form-label">Status</label><select name="status" id="edit_status" class="form-select form-select-sm">{% for st in statuses %}<option>{{ st }}</option>{% endfor %}</select></div>
                        <div class="col-6"><label class="form-label">Estimate (₹)</label><input type="number" name="cost_estimate" id="edit_cost" class="form-control form-control-sm"></div>
                        <div class="col-6"><label class="form-label">Final Cost</label><input type="number" name="final_cost" id="edit_final" class="form-control form-control-sm"></div>
                        <div class="col-6"><label class="form-label">From</label><input type="text" name="from_location" id="edit_from" class="form-control form-control-sm"></div>
                        <div class="col-6"><label class="form-label">To</label><input type="text" name="to_location" id="edit_to" class="form-control form-control-sm"></div>
                        <div class="col-6"><label class="form-label">Shifting Date</label><input type="date" name="shifting_date" id="edit_shifting_date" class="form-control form-control-sm"></div>
                        <div class="col-6"><label class="form-label">Follow-up</label><input type="date" name="followup_date" id="edit_followup" class="form-control form-control-sm"></div>
                        <div class="col-12"><label class="form-label">Notes</label><textarea name="notes" id="edit_notes" class="form-control form-control-sm" rows="2"></textarea></div>
                    </div>
                </div>
                <div class="modal-footer py-2">
                    <button type="button" class="btn btn-sm btn-light" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-sm btn-primary px-3">Update Lead</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Detailed View Modal -->
<div class="modal fade detailed-modal" id="detailModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <div>
                    <h5 class="modal-title" id="detailModalTitle">Lead Details</h5>
                    <small id="detailModalSubtitle" class="opacity-75">Complete customer information</small>
                </div>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div id="detailContent">
                    <!-- Dynamic content will be loaded here -->
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script>
    let leadsData = [];
    let statusFilter = "all";
    let searchTerm = "";
    let dateRangeStart = null;
    let dateRangeEnd = null;

    function showToast(msg, type) {
        const container = document.getElementById('toastContainer');
        const bg = type === 'success' ? '#10b981' : type === 'error' ? '#ef4444' : '#f59e0b';
        const icon = type === 'success' ? 'bi-check-circle-fill' : type === 'error' ? 'bi-x-circle-fill' : 'bi-exclamation-triangle-fill';
        const toast = document.createElement('div');
        toast.className = 'alert shadow border-0 text-white mb-2';
        toast.style.background = bg;
        toast.style.borderRadius = '12px';
        toast.style.padding = '10px 14px';
        toast.style.fontSize = '0.75rem';
        toast.style.fontWeight = '600';
        toast.innerHTML = `<div class="d-flex align-items-center gap-2"><i class="bi ${icon}"></i><div class="flex-grow-1">${msg}</div><button type="button" class="btn-close btn-close-white btn-sm" onclick="this.parentElement.parentElement.remove()"></button></div>`;
        container.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }

    function refreshPage() {
        window.location.reload();
    }

    async function fetchCallLogs(leadId) {
        try {
            const res = await fetch(`/api/lead/${leadId}/call_logs?t=${Date.now()}`);
            if(res.ok) {
                const data = await res.json();
                return data.call_history || [];
            }
        } catch(e) {
            console.error("Error fetching call logs:", e);
        }
        return [];
    }

    async function addCallLog(leadId, note) {
        const formData = new URLSearchParams();
        formData.append('call_note', note);
        
        const res = await fetch(`/add_call_log/${leadId}`, { 
            method: 'POST', 
            body: formData,
            headers: { 'X-Requested-With': 'XMLHttpRequest' }
        });
        
        return res.ok;
    }

    function openDetailModal(lead) {
        const modal = new bootstrap.Modal(document.getElementById('detailModal'));
        document.getElementById('detailModalTitle').innerHTML = `<i class="bi bi-person-circle me-2"></i>${escapeHtml(lead.name)}`;
        
        const daysOld = lead.created_at ? Math.floor((new Date() - new Date(lead.created_at)) / (1000*60*60*24)) : 0;
        
        document.getElementById('detailContent').innerHTML = `
            <div class="info-grid">
                <div class="detail-section">
                    <div class="detail-label"><i class="bi bi-telephone-fill"></i> Phone Numbers</div>
                    <div class="detail-value">
                        <a href="tel:${lead.phone}" class="btn btn-sm btn-outline-primary mt-1">📞 ${lead.phone}</a>
                        ${lead.alternate_phone ? `<a href="tel:${lead.alternate_phone}" class="btn btn-sm btn-outline-secondary mt-1 ms-2">📱 ${lead.alternate_phone}</a>` : ''}
                    </div>
                </div>
                <div class="detail-section">
                    <div class="detail-label"><i class="bi bi-geo-alt-fill"></i> Location</div>
                    <div class="detail-value-large">${escapeHtml(lead.from_location) || '—'} <i class="bi bi-arrow-right"></i> ${escapeHtml(lead.to_location) || '—'}</div>
                </div>
                <div class="detail-section">
                    <div class="detail-label"><i class="bi bi-tag-fill"></i> Source</div>
                    <div class="detail-value"><span class="badge bg-secondary">${escapeHtml(lead.source)}</span></div>
                </div>
                <div class="detail-section">
                    <div class="detail-label"><i class="bi bi-bar-chart-fill"></i> Status</div>
                    <div class="detail-value"><span class="badge" style="background:${getStatusColor(lead.status)}">${lead.status}</span></div>
                </div>
                <div class="detail-section">
                    <div class="detail-label"><i class="bi bi-currency-rupee"></i> Cost Details</div>
                    <div class="detail-value">
                        <div>Estimated: ₹${Number(lead.cost_estimate || 0).toLocaleString()}</div>
                        <div>Final: ₹${Number(lead.final_cost || 0).toLocaleString()}</div>
                        <div>Advance: ₹${Number(lead.advance_paid || 0).toLocaleString()}</div>
                        <div>Payment: <span class="badge bg-info">${lead.payment_status || 'Pending'}</span></div>
                    </div>
                </div>
                <div class="detail-section">
                    <div class="detail-label"><i class="bi bi-calendar-event"></i> Important Dates</div>
                    <div class="detail-value">
                        <div>Created: ${new Date(lead.created_at).toLocaleDateString()}</div>
                        <div>${daysOld} days ago</div>
                        ${lead.shifting_date ? `<div>Shifting: ${lead.shifting_date}</div>` : ''}
                        ${lead.followup_date ? `<div>Follow-up: ${lead.followup_date}</div>` : ''}
                    </div>
                </div>
                <div class="detail-section">
                    <div class="detail-label"><i class="bi bi-truck"></i> Vehicle & Driver</div>
                    <div class="detail-value">
                        <div>Vehicle: ${lead.vehicle_assigned || 'Not Assigned'}</div>
                        <div>Driver: ${lead.driver_name || '—'} ${lead.driver_phone ? `(${lead.driver_phone})` : ''}</div>
                        ${lead.goods_description ? `<div>Goods: ${escapeHtml(lead.goods_description)}</div>` : ''}
                    </div>
                </div>
                <div class="detail-section col-span-2">
                    <div class="detail-label"><i class="bi bi-chat-text"></i> Notes</div>
                    <div class="detail-value">${escapeHtml(lead.notes) || 'No notes added'}</div>
                </div>
            </div>
            
            <div class="detail-section">
                <div class="detail-label"><i class="bi bi-chat-dots"></i> Call Logs</div>
                <div id="callLogsModalContent" class="call-logs-container">
                    <div class="text-center text-muted">Loading call logs...</div>
                </div>
                <div class="new-call-input mt-2">
                    <textarea id="modalCallNote" class="form-control form-control-sm" rows="2" placeholder="Add new call note..."></textarea>
                    <button id="saveModalCallLog" class="btn btn-primary btn-sm mt-2 w-100" data-id="${lead.id}" data-name="${escapeHtml(lead.name)}">
                        <i class="bi bi-save"></i> Save Call Log
                    </button>
                </div>
            </div>
            
            <div class="modal-action-buttons">
                <button class="modal-action-btn btn-edit-modal" id="modalEditBtn" data-id="${lead.id}">
                    <i class="bi bi-pencil-square"></i> Edit Lead
                </button>
                <button class="modal-action-btn btn-call-modal" id="modalCallBtn" data-phone="${lead.phone}">
                    <i class="bi bi-telephone-fill"></i> Call
                </button>
                <button class="modal-action-btn btn-whatsapp-modal" id="modalWhatsAppBtn" data-phone="${lead.phone}">
                    <i class="bi bi-whatsapp"></i> WhatsApp
                </button>
                <button class="modal-action-btn btn-delete-modal" id="modalDeleteBtn" data-id="${lead.id}" data-name="${escapeHtml(lead.name)}">
                    <i class="bi bi-trash3"></i> Delete
                </button>
            </div>
        `;
        
        modal.show();
        
        // Load call logs
        loadCallLogsInModal(lead.id);
        
        // Attach event listeners for modal buttons
        document.getElementById('modalEditBtn').addEventListener('click', () => {
            modal.hide();
            openEditModal(lead);
        });
        
        document.getElementById('modalCallBtn').addEventListener('click', () => {
            window.location.href = `tel:${lead.phone}`;
        });
        
        document.getElementById('modalWhatsAppBtn').addEventListener('click', () => {
            window.open(`https://wa.me/91${lead.phone}`, '_blank');
        });
        
        document.getElementById('modalDeleteBtn').addEventListener('click', async (e) => {
            if(confirm(`Delete ${lead.name} permanently?`)) {
                const res = await fetch(`/delete_lead/${lead.id}`);
                if(res.ok) {
                    showToast('✓ Lead deleted! Refreshing...', 'success');
                    modal.hide();
                    setTimeout(() => refreshPage(), 500);
                } else {
                    showToast('Failed to delete', 'error');
                }
            }
        });
        
        const saveBtn = document.getElementById('saveModalCallLog');
        saveBtn.addEventListener('click', async () => {
            const note = document.getElementById('modalCallNote').value.trim();
            if(!note) {
                showToast('Please enter a call note', 'error');
                return;
            }
            const success = await addCallLog(lead.id, note);
            if(success) {
                showToast('✓ Call log added!', 'success');
                document.getElementById('modalCallNote').value = '';
                await loadCallLogsInModal(lead.id);
            } else {
                showToast('Failed to add call log', 'error');
            }
        });
    }
    
    async function loadCallLogsInModal(leadId) {
        const container = document.getElementById('callLogsModalContent');
        const logs = await fetchCallLogs(leadId);
        
        if(logs.length === 0) {
            container.innerHTML = '<div class="text-center text-muted py-3"><i class="bi bi-chat-dots"></i><br>No call logs yet</div>';
        } else {
            container.innerHTML = logs.map(log => `
                <div class="call-log-item-modal">
                    <div class="call-log-time-modal"><i class="bi bi-clock"></i> ${log.timestamp || new Date(log.created_at).toLocaleString()}</div>
                    <div class="call-log-note-modal"><i class="bi bi-chat-text"></i> ${escapeHtml(log.note || 'No note')}</div>
                </div>
            `).join('');
        }
    }

    function openEditModal(lead) {
        document.getElementById('edit_lead_id').value = lead.id;
        document.getElementById('edit_name').value = lead.name || '';
        document.getElementById('edit_phone').value = lead.phone || '';
        document.getElementById('edit_alt_phone').value = lead.alternate_phone || '';
        document.getElementById('edit_source').value = lead.source || 'Google Adsense';
        document.getElementById('edit_status').value = lead.status || 'New Lead';
        document.getElementById('edit_cost').value = lead.cost_estimate || 0;
        document.getElementById('edit_final').value = lead.final_cost || 0;
        document.getElementById('edit_from').value = lead.from_location || '';
        document.getElementById('edit_to').value = lead.to_location || '';
        document.getElementById('edit_shifting_date').value = lead.shifting_date || '';
        document.getElementById('edit_followup').value = lead.followup_date || '';
        document.getElementById('edit_notes').value = lead.notes || '';
        
        const editModal = new bootstrap.Modal(document.getElementById('editModalGlobal'));
        editModal.show();
    }

    async function initialLoad() {
        try {
            const res = await fetch('/api/leads?t=' + Date.now());
            if(res.ok) {
                leadsData = await res.json();
                leadsData.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
                renderLeadsAndStats();
            } else if(window.initialLeads) {
                leadsData = window.initialLeads;
                leadsData.sort((a,b) => new Date(b.created_at) - new Date(a.created_at));
                renderLeadsAndStats();
            }
        } catch(e) { console.error("Initial load error:", e); }
    }

    function filterByDateRange(lead) {
        if(!dateRangeStart && !dateRangeEnd) return true;
        if(!lead.created_at) return false;
        const leadDate = new Date(lead.created_at);
        if(dateRangeStart && dateRangeEnd) return leadDate >= dateRangeStart && leadDate <= dateRangeEnd;
        if(dateRangeStart) return leadDate >= dateRangeStart;
        if(dateRangeEnd) return leadDate <= dateRangeEnd;
        return true;
    }

    function renderLeadsAndStats() {
        if(!leadsData || leadsData.length === 0) {
            document.getElementById('leadsListContainer').innerHTML = `<div class="text-center p-4 bg-white rounded-3"><i class="bi bi-inbox fs-3 text-muted"></i><p class="mt-2 text-muted small">No leads yet. Click + to add your first lead!</p></div>`;
            document.getElementById('leadCountSpan').innerText = "0";
            return;
        }
        
        let filtered = leadsData.filter(lead => {
            if(statusFilter !== "all" && lead.status !== statusFilter) return false;
            if(searchTerm && !(lead.name + " " + lead.phone + " " + (lead.from_location||"") + " " + (lead.to_location||"")).toLowerCase().includes(searchTerm.toLowerCase())) return false;
            if(!filterByDateRange(lead)) return false;
            return true;
        });

        document.getElementById('leadCountSpan').innerText = filtered.length;
        const adsense = filtered.filter(l=>l.source === 'Google Adsense').length;
        const justdial = filtered.filter(l=>l.source === 'Justdial').length;
        const whatsapp = filtered.filter(l=>l.source === 'WhatsApp').length;
        
        document.getElementById('statsContainer').innerHTML = `
            <div class="stat-card"><i class="bi bi-people-fill text-primary"></i><div class="stat-number">${filtered.length}</div><div class="stat-label">LEADS</div></div>
            <div class="stat-card"><i class="bi bi-google text-danger"></i><div class="stat-number">${adsense}</div><div class="stat-label">ADSENSE</div></div>
            <div class="stat-card"><i class="bi bi-building text-info"></i><div class="stat-number">${justdial}</div><div class="stat-label">JUSTDIAL</div></div>
            <div class="stat-card"><i class="bi bi-whatsapp text-success"></i><div class="stat-number">${whatsapp}</div><div class="stat-label">WHATSAPP</div></div>
        `;

        const container = document.getElementById('leadsListContainer');
        if(filtered.length === 0) {
            container.innerHTML = `<div class="text-center p-4 bg-white rounded-3"><i class="bi bi-inbox fs-3 text-muted"></i><p class="mt-2 text-muted small">No leads match filters</p></div>`;
            return;
        }
        
        container.innerHTML = filtered.map(lead => {
            const daysOld = lead.created_at ? Math.floor((new Date() - new Date(lead.created_at)) / (1000*60*60*24)) : 0;
            return `
            <div class="lead-card" data-lead-id="${lead.id}">
                <div class="lead-header">
                    <div class="customer-name">
                        <i class="bi bi-person-circle" style="font-size:0.7rem;"></i> ${escapeHtml(lead.name)}
                        <span class="badge-source">${escapeHtml(lead.source)}</span>
                    </div>
                    <span class="status-chip" style="background:${getStatusColor(lead.status)}20; color:${getStatusColor(lead.status)};">${lead.status}</span>
                </div>
                <div class="phone-group">
                    <a href="tel:${lead.phone}" class="phone-link"><i class="bi bi-telephone-fill"></i> ${lead.phone}</a>
                    <a href="https://wa.me/91${lead.phone}" target="_blank" class="phone-link whatsapp-link"><i class="bi bi-whatsapp"></i> Chat</a>
                </div>
                <div class="location-row">
                    <i class="bi bi-geo-alt-fill"></i> ${escapeHtml(lead.from_location) || '—'} → ${escapeHtml(lead.to_location) || '—'}
                </div>
                <div class="d-flex justify-content-between align-items-center gap-1 mt-1">
                    <div class="cost-badge">₹${Number(lead.cost_estimate || 0).toLocaleString()}</div>
                    <div class="date-badge"><i class="bi bi-clock"></i> ${daysOld}d ago</div>
                </div>
                <button class="expand-btn" data-lead-id="${lead.id}">
                    <i class="bi bi-eye-fill"></i> View Details
                </button>
            </div>
        `}).join('');
        
        // Attach click handlers for expand buttons
        document.querySelectorAll('.expand-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const leadId = parseInt(btn.dataset.leadId);
                const lead = leadsData.find(l => l.id === leadId);
                if(lead) openDetailModal(lead);
            });
        });
        
        // Also attach click handler to the whole card
        document.querySelectorAll('.lead-card').forEach(card => {
            card.addEventListener('click', (e) => {
                // Don't trigger if clicking on phone links or expand button
                if(e.target.closest('.phone-link')) return;
                if(e.target.closest('.expand-btn')) return;
                const leadId = parseInt(card.dataset.leadId);
                const lead = leadsData.find(l => l.id === leadId);
                if(lead) openDetailModal(lead);
            });
        });
    }

    document.getElementById('editFormDynamic').addEventListener('submit', async (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        try {
            const res = await fetch(`/edit_lead/${formData.get('lead_id')}`, { method: 'POST', body: formData });
            if(res.ok) {
                showToast('✓ Lead updated! Refreshing...', 'success');
                bootstrap.Modal.getInstance(document.getElementById('editModalGlobal')).hide();
                setTimeout(() => refreshPage(), 500);
            } else {
                showToast('Update failed', 'error');
            }
        } catch(err) { showToast('Error updating lead', 'error'); }
    });

    document.getElementById('addLeadForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        try {
            const res = await fetch('/add_lead', { method: 'POST', body: formData });
            if(res.ok) {
                showToast('✓ Lead added! Refreshing...', 'success');
                bootstrap.Modal.getInstance(document.getElementById('addLeadModal')).hide();
                e.target.reset();
                setTimeout(() => refreshPage(), 500);
            } else {
                const text = await res.text();
                if(text.includes("Duplicate")) showToast('⚠️ Duplicate phone number!', 'error');
                else showToast('Failed to add lead', 'error');
            }
        } catch(err) { showToast('Error adding lead', 'error'); }
    });

    function getStatusColor(status) {
        if(status.includes('Won')) return '#10b981';
        if(status.includes('Lost')) return '#ef4444';
        if(status.includes('Ready')) return '#3b82f6';
        if(status === 'New Lead') return '#f59e0b';
        return '#6b7280';
    }

    function escapeHtml(str) { 
        if(!str) return ''; 
        return str.replace(/[&<>]/g, function(m) {
            return m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;';
        });
    }

    // Calendar
    const fp = flatpickr('#calendarTrigger', {
        mode: "range",
        dateFormat: "d M",
        onChange: function(dates) {
            if(dates.length === 2) {
                dateRangeStart = dates[0];
                dateRangeEnd = dates[1];
                document.getElementById('calendarLabel').innerHTML = `${fp.formatDate(dateRangeStart, "d M")} - ${fp.formatDate(dateRangeEnd, "d M")}`;
                renderLeadsAndStats();
            } else if(dates.length === 1) {
                dateRangeStart = dates[0];
                dateRangeEnd = null;
                document.getElementById('calendarLabel').innerHTML = `${fp.formatDate(dateRangeStart, "d M")}+`;
                renderLeadsAndStats();
            } else {
                dateRangeStart = null;
                dateRangeEnd = null;
                document.getElementById('calendarLabel').innerHTML = "Date";
                renderLeadsAndStats();
            }
        }
    });

    document.getElementById('calendarTrigger').addEventListener('dblclick', () => {
        fp.clear();
        dateRangeStart = null;
        dateRangeEnd = null;
        document.getElementById('calendarLabel').innerHTML = "Date";
        renderLeadsAndStats();
    });

    document.getElementById('globalSearch').addEventListener('input', (e) => { searchTerm = e.target.value; renderLeadsAndStats(); });
    document.getElementById('statusFilterGlobal').addEventListener('change', (e) => { statusFilter = e.target.value; renderLeadsAndStats(); });
    
    initialLoad();

    {% if leads %}
    window.initialLeads = {{ leads | tojson | safe }};
    setTimeout(() => {
        if(leadsData.length === 0 && window.initialLeads) {
            leadsData = window.initialLeads.sort((a,b)=> new Date(b.created_at) - new Date(a.created_at));
            renderLeadsAndStats();
        }
    }, 100);
    {% endif %}
</script>
</body>
</html>
