<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes, maximum-scale=1.0">
    <title>Active Packers & Movers | Lead Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f5f7fb;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            padding-bottom: 70px;
        }

        .navbar-modern {
            background: linear-gradient(135deg, #0b2b5c 0%, #1a4a8b 100%);
            padding: 0.5rem 0;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .brand-icon {
            font-size: 1.2rem;
            margin-right: 6px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            margin-bottom: 10px;
        }

        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 6px 3px;
            text-align: center;
            box-shadow: 0 1px 2px rgba(0,0,0,0.03);
            cursor: pointer;
            transition: all 0.2s;
        }

        .stat-card:active {
            transform: scale(0.98);
        }

        .stat-card i {
            font-size: 1rem;
            margin-bottom: 2px;
            display: block;
        }

        .stat-label {
            font-size: 8px;
            font-weight: 700;
            text-transform: uppercase;
            color: #64748b;
        }

        .stat-number {
            font-size: 1.1rem;
            font-weight: 800;
            line-height: 1.1;
            color: #0a2540;
        }

        .action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 8px 0 6px;
        }

        .btn-compact {
            border-radius: 30px;
            padding: 4px 12px;
            font-weight: 600;
            font-size: 0.7rem;
        }

        .filter-row-horizontal {
            display: flex;
            gap: 6px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        .search-box-horizontal {
            flex: 2;
            position: relative;
            min-width: 120px;
        }

        .search-box-horizontal i {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 0.75rem;
            color: #94a3b8;
        }

        .search-box-horizontal input {
            width: 100%;
            padding: 6px 8px 6px 28px;
            border-radius: 20px;
            border: 1px solid #e2e8f0;
            background: white;
            font-size: 0.7rem;
        }

        .status-select-horizontal {
            flex: 1;
            min-width: 100px;
        }

        .status-select-horizontal select {
            width: 100%;
            padding: 6px 8px;
            border-radius: 20px;
            background: white;
            border: 1px solid #e2e8f0;
            font-size: 0.7rem;
            font-weight: 500;
        }

        .calendar-trigger {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            padding: 5px 10px;
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            white-space: nowrap;
        }

        .calendar-trigger i {
            font-size: 0.75rem;
            color: #1a4a8b;
        }

        .calendar-trigger span {
            font-size: 0.7rem;
            font-weight: 500;
            color: #0a2540;
        }

        .lead-card {
            background: white;
            border-radius: 12px;
            margin-bottom: 6px;
            padding: 8px 10px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.03);
            border: 1px solid #edf2f7;
            transition: all 0.2s ease;
        }

        .lead-card-new {
            animation: fadeInUp 0.3s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .lead-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }

        .customer-name {
            font-weight: 700;
            font-size: 0.8rem;
            color: #0a2540;
            display: flex;
            align-items: center;
            gap: 4px;
            flex-wrap: wrap;
        }

        .badge-source {
            background: #eef2ff;
            color: #1e4a8a;
            font-size: 0.55rem;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 30px;
        }

        .status-chip {
            display: inline-flex;
            align-items: center;
            padding: 2px 8px;
            border-radius: 30px;
            font-size: 0.6rem;
            font-weight: 700;
        }

        .phone-group {
            display: flex;
            gap: 6px;
            align-items: center;
            margin: 4px 0;
            flex-wrap: wrap;
        }

        .phone-link {
            text-decoration: none;
            font-weight: 600;
            background: #f1f5f9;
            padding: 3px 8px;
            border-radius: 25px;
            font-size: 0.65rem;
            display: inline-flex;
            align-items: center;
            gap: 3px;
        }

        .whatsapp-link {
            background: #dcfce7;
            color: #0e6b2b;
        }

        .location-row {
            font-size: 0.6rem;
            background: #f8fafc;
            padding: 4px 6px;
            border-radius: 10px;
            margin: 4px 0;
            display: flex;
            align-items: center;
            gap: 4px;
            flex-wrap: wrap;
        }

        .cost-badge {
            font-weight: 700;
            background: #fff7ed;
            padding: 2px 6px;
            border-radius: 20px;
            font-size: 0.65rem;
        }

        .date-badge {
            background: #e7f1ff;
            border-radius: 20px;
            padding: 2px 6px;
            font-size: 0.6rem;
            font-weight: 600;
        }

        .action-icons {
            display: flex;
            gap: 4px;
            margin-top: 6px;
            padding-top: 6px;
            border-top: 1px solid #edf2f7;
            justify-content: flex-end;
        }

        .action-icon {
            background: none;
            border: none;
            font-size: 0.7rem;
            color: #64748b;
            display: inline-flex;
            align-items: center;
            gap: 3px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 25px;
            min-height: 32px;
        }

        .action-icon i {
            font-size: 0.8rem;
        }

        .action-icon:active {
            background: #e2e8f0;
            transform: scale(0.96);
        }

        .modal-content {
            border-radius: 20px;
            margin: 10px;
        }

        .modal-header {
            padding: 12px 16px;
        }

        .modal-body {
            padding: 16px;
            max-height: 70vh;
            overflow-y: auto;
        }

        .form-control-sm, .form-select-sm {
            font-size: 0.8rem;
            padding: 6px 10px;
        }

        .form-label {
            font-size: 0.7rem;
            margin-bottom: 3px;
        }

        .fab-add {
            position: fixed;
            bottom: 15px;
            right: 15px;
            background: linear-gradient(135deg, #0b2b5c 0%, #1a4a8b 100%);
            width: 48px;
            height: 48px;
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 3px 10px rgba(0,0,0,0.2);
            z-index: 1050;
            border: none;
            color: white;
            font-size: 1.4rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .fab-add:active {
            transform: scale(0.95);
        }

        .toast-notification {
            position: fixed;
            top: 60px;
            right: 10px;
            left: 10px;
            z-index: 9999;
            animation: slideDown 0.2s ease-out;
        }

        @keyframes slideDown {
            from {
                transform: translateY(-100%);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        /* Live indicator - small dot showing auto-refresh is active */
        .live-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: #10b981;
            border-radius: 50%;
            margin-left: 6px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
            }
            70% {
                box-shadow: 0 0 0 5px rgba(16, 185, 129, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(16, 185, 129, 0);
            }
        }

        @media (min-width: 768px) {
            .fab-add {
                display: none;
            }
            
            .stats-grid {
                gap: 12px;
            }
            
            .stat-card {
                padding: 10px;
            }
            
            .stat-number {
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>

<div id="toastContainer" class="toast-notification"></div>

<nav class="navbar-modern">
    <div class="container">
        <div class="d-flex align-items-center text-white">
            <i class="bi bi-truck brand-icon"></i>
            <div>
                <span class="fw-bold" style="font-size: 0.9rem;">Active Packers & Movers</span>
                <small class="d-block" style="font-size: 0.55rem; opacity: 0.9;">LEAD MANAGER</small>
            </div>
        </div>
        <div>
            <span class="badge bg-white text-dark px-2 py-1 rounded-pill" style="font-size: 0.55rem;">
                <i class="bi bi-cloud-check"></i> Live
                <span class="live-indicator"></span>
            </span>
        </div>
    </div>
</nav>

<div class="container mt-2">
    <div class="stats-grid" id="statsContainer">
        <div class="stat-card"><i class="bi bi-people-fill text-primary"></i><div class="stat-number">0</div><div class="stat-label">LEADS</div></div>
        <div class="stat-card"><i class="bi bi-google text-danger"></i><div class="stat-number">0</div><div class="stat-label">ADSENSE</div></div>
        <div class="stat-card"><i class="bi bi-building text-info"></i><div class="stat-number">0</div><div class="stat-label">JUSTDIAL</div></div>
        <div class="stat-card"><i class="bi bi-whatsapp text-success"></i><div class="stat-number">0</div><div class="stat-label">WHATSAPP</div></div>
    </div>

    <div class="action-bar">
        <h6 class="m-0 fw-bold" style="font-size: 0.75rem;">
            <i class="bi bi-people-fill me-1"></i> <span id="leadCountSpan">0</span> Leads
            <small class="text-muted" style="font-size: 0.55rem;">(auto-refresh 0.1s)</small>
        </h6>
        <div class="d-flex gap-2">
            <a href="/export_excel" id="exportBtn" class="btn btn-outline-success btn-compact"><i class="bi bi-file-earmark-spreadsheet"></i> Export</a>
            <button class="btn btn-primary btn-compact d-none d-md-block" data-bs-toggle="modal" data-bs-target="#addLeadModal"><i class="bi bi-plus-lg"></i> Add</button>
        </div>
    </div>

    <div class="filter-row-horizontal">
        <div class="search-box-horizontal">
            <i class="bi bi-search"></i>
            <input type="text" id="globalSearch" placeholder="Search...">
        </div>
        
        <div class="status-select-horizontal">
            <select id="statusFilterGlobal">
                <option value="all">All Status</option>
                {% for status in statuses %}
                <option value="{{ status }}">{{ status }}</option>
                {% endfor %}
            </select>
        </div>
        
        <div class="calendar-trigger" id="calendarTrigger">
            <i class="bi bi-calendar-range"></i>
            <span id="calendarLabel">Date</span>
            <i class="bi bi-chevron-down"></i>
        </div>
    </div>

    <div id="leadsListContainer">
        <!-- Leads will appear here automatically -->
    </div>
</div>

<button class="fab-add" data-bs-toggle="modal" data-bs-target="#addLeadModal">
    <i class="bi bi-plus-lg"></i>
</button>

<!-- Add Lead Modal -->
<div class="modal fade" id="addLeadModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h6 class="modal-title m-0"><i class="bi bi-plus-circle me-2"></i> New Lead</h6>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <form id="addLeadForm">
                <div class="modal-body">
                    <div class="row g-2">
                        <div class="col-12">
                            <label class="form-label">Name *</label>
                            <input type="text" name="name" class="form-control form-control-sm" required>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Phone *</label>
                            <input type="tel" name="phone" class="form-control form-control-sm" required>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Source</label>
                            <select name="source" class="form-select form-select-sm">
                                {% for src in sources %}
                                <option>{{ src }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Status</label>
                            <select name="status" class="form-select form-select-sm">
                                {% for st in statuses %}
                                <option>{{ st }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-6">
                            <label class="form-label">From</label>
                            <input type="text" name="from_location" class="form-control form-control-sm" placeholder="City">
                        </div>
                        <div class="col-6">
                            <label class="form-label">To</label>
                            <input type="text" name="to_location" class="form-control form-control-sm" placeholder="City">
                        </div>
                        <div class="col-6">
                            <label class="form-label">Estimate (₹)</label>
                            <input type="number" name="cost_estimate" class="form-control form-control-sm" value="0">
                        </div>
                        <div class="col-6">
                            <label class="form-label">Shifting Date</label>
                            <input type="date" name="shifting_date" class="form-control form-control-sm">
                        </div>
                        <div class="col-12">
                            <label class="form-label">Notes</label>
                            <textarea name="notes" class="form-control form-control-sm" rows="2"></textarea>
                        </div>
                    </div>
                </div>
                <div class="modal-footer py-2">
                    <button type="button" class="btn btn-sm btn-light" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-sm btn-primary px-3">Save Lead</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Edit Modal -->
<div class="modal fade" id="editModalGlobal" tabindex="-1">
    <div class="modal-dialog modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h6 class="modal-title m-0"><i class="bi bi-pencil-square me-2"></i> Edit Lead</h6>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <form id="editFormDynamic">
                <input type="hidden" name="lead_id" id="edit_lead_id">
                <div class="modal-body">
                    <div class="row g-2">
                        <div class="col-12">
                            <label class="form-label">Name *</label>
                            <input type="text" name="name" id="edit_name" class="form-control form-control-sm" required>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Phone *</label>
                            <input type="tel" name="phone" id="edit_phone" class="form-control form-control-sm" required>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Alt Phone</label>
                            <input type="tel" name="alternate_phone" id="edit_alt_phone" class="form-control form-control-sm">
                        </div>
                        <div class="col-6">
                            <label class="form-label">Source</label>
                            <select name="source" id="edit_source" class="form-select form-select-sm">
                                {% for src in sources %}
                                <option>{{ src }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-6">
                            <label class="form-label">Status</label>
                            <select name="status" id="edit_status" class="form-select form-select-sm">
                                {% for st in statuses %}
                                <option>{{ st }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-6">
                            <label class="form-label">Estimate (₹)</label>
                            <input type="number" name="cost_estimate" id="edit_cost" class="form-control form-control-sm">
                        </div>
                        <div class="col-6">
                            <label class="form-label">Final Cost</label>
                            <input type="number" name="final_cost" id="edit_final" class="form-control form-control-sm">
                        </div>
                        <div class="col-6">
                            <label class="form-label">From</label>
                            <input type="text" name="from_location" id="edit_from" class="form-control form-control-sm">
                        </div>
                        <div class="col-6">
                            <label class="form-label">To</label>
                            <input type="text" name="to_location" id="edit_to" class="form-control form-control-sm">
                        </div>
                        <div class="col-6">
                            <label class="form-label">Shifting Date</label>
                            <input type="date" name="shifting_date" id="edit_shifting_date" class="form-control form-control-sm">
                        </div>
                        <div class="col-6">
                            <label class="form-label">Follow-up</label>
                            <input type="date" name="followup_date" id="edit_followup" class="form-control form-control-sm">
                        </div>
                        <div class="col-12">
                            <label class="form-label">Notes</label>
                            <textarea name="notes" id="edit_notes" class="form-control form-control-sm" rows="2"></textarea>
                        </div>
                    </div>
                </div>
                <div class="modal-footer py-2">
                    <button type="button" class="btn btn-sm btn-light" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-sm btn-primary px-3">Update Lead</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script>
    let leadsData = [];
    let statusFilter = "all";
    let searchTerm = "";
    let dateRangeStart = null;
    let dateRangeEnd = null;
    let isRefreshing = false;
    let refreshInterval = null;

    function showToast(msg, type) {
        const container = document.getElementById('toastContainer');
        const bg = type === 'success' ? '#10b981' : type === 'error' ? '#ef4444' : '#f59e0b';
        const icon = type === 'success' ? 'bi-check-circle-fill' : type === 'error' ? 'bi-x-circle-fill' : 'bi-exclamation-triangle-fill';
        const toast = document.createElement('div');
        toast.className = 'alert shadow border-0 text-white mb-2';
        toast.style.background = bg;
        toast.style.borderRadius = '12px';
        toast.style.padding = '10px 14px';
        toast.style.fontSize = '0.75rem';
        toast.style.fontWeight = '600';
        toast.innerHTML = `<div class="d-flex align-items-center gap-2"><i class="bi ${icon}"></i><div class="flex-grow-1">${msg}</div><button type="button" class="btn-close btn-close-white btn-sm" onclick="this.parentElement.parentElement.remove()"></button></div>`;
        container.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }

    // Ultra-fast auto refresh every 0.1 seconds (100ms)
    async function autoRefresh() {
        if(isRefreshing) return;
        isRefreshing = true;
        
        try {
            const timestamp = new Date().getTime();
            const res = await fetch('/api/leads?t=' + timestamp);
            
            if(res.ok) {
                const newData = await res.json();
                newData.sort((a, b) => {
                    const dateA = new Date(a.created_at);
                    const dateB = new Date(b.created_at);
                    return dateB - dateA;
                });
                
                // Check if data changed
                const dataChanged = JSON.stringify(leadsData) !== JSON.stringify(newData);
                if(dataChanged || leadsData.length === 0) {
                    leadsData = newData;
                    renderLeadsAndStats();
                }
            }
        } catch(e) { 
            // Silent fail - no error messages to user
            console.error("Auto-refresh error:", e);
        } finally {
            isRefreshing = false;
        }
    }

    // Start auto-refresh every 0.1 seconds
    function startAutoRefresh() {
        if(refreshInterval) clearInterval(refreshInterval);
        refreshInterval = setInterval(() => {
            autoRefresh();
        }, 100); // 100 milliseconds = 0.1 seconds
        console.log("Auto-refresh started: every 0.1 seconds");
    }

    // Stop auto-refresh (if needed)
    function stopAutoRefresh() {
        if(refreshInterval) {
            clearInterval(refreshInterval);
            refreshInterval = null;
            console.log("Auto-refresh stopped");
        }
    }

    function filterByDateRange(lead) {
        if(!dateRangeStart && !dateRangeEnd) return true;
        if(!lead.created_at) return false;
        const leadDate = new Date(lead.created_at);
        leadDate.setHours(0, 0, 0, 0);
        
        if(dateRangeStart && dateRangeEnd) {
            const start = new Date(dateRangeStart);
            start.setHours(0, 0, 0, 0);
            const end = new Date(dateRangeEnd);
            end.setHours(23, 59, 59, 999);
            return leadDate >= start && leadDate <= end;
        } else if(dateRangeStart) {
            const start = new Date(dateRangeStart);
            start.setHours(0, 0, 0, 0);
            return leadDate >= start;
        } else if(dateRangeEnd) {
            const end = new Date(dateRangeEnd);
            end.setHours(23, 59, 59, 999);
            return leadDate <= end;
        }
        return true;
    }

    function renderLeadsAndStats() {
        if(!leadsData || leadsData.length === 0) {
            document.getElementById('leadsListContainer').innerHTML = `
                <div class="text-center p-4 bg-white rounded-3">
                    <i class="bi bi-inbox fs-3 text-muted"></i>
                    <p class="mt-2 text-muted small">No leads yet. Click + to add your first lead!</p>
                </div>`;
            document.getElementById('leadCountSpan').innerText = "0";
            document.getElementById('statsContainer').innerHTML = `
                <div class="stat-card"><i class="bi bi-people-fill text-primary"></i><div class="stat-number">0</div><div class="stat-label">LEADS</div></div>
                <div class="stat-card"><i class="bi bi-google text-danger"></i><div class="stat-number">0</div><div class="stat-label">ADSENSE</div></div>
                <div class="stat-card"><i class="bi bi-building text-info"></i><div class="stat-number">0</div><div class="stat-label">JUSTDIAL</div></div>
                <div class="stat-card"><i class="bi bi-whatsapp text-success"></i><div class="stat-number">0</div><div class="stat-label">WHATSAPP</div></div>`;
            return;
        }
        
        let filtered = leadsData.filter(lead => {
            if(statusFilter !== "all" && lead.status !== statusFilter) return false;
            if(searchTerm !== "") {
                const haystack = (lead.name + " " + lead.phone + " " + (lead.from_location||"") + " " + (lead.to_location||"")).toLowerCase();
                if(!haystack.includes(searchTerm.toLowerCase())) return false;
            }
            if(!filterByDateRange(lead)) return false;
            return true;
        });

        document.getElementById('leadCountSpan').innerText = filtered.length;
        const adsense = filtered.filter(l=>l.source === 'Google Adsense').length;
        const justdial = filtered.filter(l=>l.source === 'Justdial').length;
        const whatsapp = filtered.filter(l=>l.source === 'WhatsApp').length;
        
        document.getElementById('statsContainer').innerHTML = `
            <div class="stat-card"><i class="bi bi-people-fill text-primary"></i><div class="stat-number">${filtered.length}</div><div class="stat-label">LEADS</div></div>
            <div class="stat-card"><i class="bi bi-google text-danger"></i><div class="stat-number">${adsense}</div><div class="stat-label">ADSENSE</div></div>
            <div class="stat-card"><i class="bi bi-building text-info"></i><div class="stat-number">${justdial}</div><div class="stat-label">JUSTDIAL</div></div>
            <div class="stat-card"><i class="bi bi-whatsapp text-success"></i><div class="stat-number">${whatsapp}</div><div class="stat-label">WHATSAPP</div></div>
        `;

        const container = document.getElementById('leadsListContainer');
        if(filtered.length === 0) {
            container.innerHTML = `<div class="text-center p-4 bg-white rounded-3"><i class="bi bi-inbox fs-3 text-muted"></i><p class="mt-2 text-muted small">No leads match filters</p></div>`;
            return;
        }
        
        container.innerHTML = filtered.map(lead => {
            const daysOld = lead.created_at ? Math.floor((new Date() - new Date(lead.created_at)) / (1000*60*60*24)) : 0;
            return `
            <div class="lead-card">
                <div class="lead-header">
                    <div class="customer-name">
                        <i class="bi bi-person-circle" style="font-size:0.7rem;"></i> ${escapeHtml(lead.name)}
                        <span class="badge-source">${escapeHtml(lead.source)}</span>
                    </div>
                    <span class="status-chip" style="background:${getStatusColor(lead.status)}20; color:${getStatusColor(lead.status)};">${lead.status}</span>
                </div>
                <div class="phone-group">
                    <a href="tel:${lead.phone}" class="phone-link"><i class="bi bi-telephone-fill"></i> ${lead.phone}</a>
                    ${lead.alternate_phone ? `<a href="tel:${lead.alternate_phone}" class="phone-link"><i class="bi bi-phone"></i> ${lead.alternate_phone}</a>` : ''}
                    <a href="https://wa.me/91${lead.phone}" target="_blank" class="phone-link whatsapp-link"><i class="bi bi-whatsapp"></i> Chat</a>
                </div>
                <div class="location-row">
                    <i class="bi bi-geo-alt-fill"></i> ${escapeHtml(lead.from_location) || '—'} → ${escapeHtml(lead.to_location) || '—'}
                </div>
                <div class="d-flex justify-content-between align-items-center gap-1 mt-1">
                    <div class="cost-badge">₹${Number(lead.cost_estimate || 0).toLocaleString()}</div>
                    <div class="date-badge"><i class="bi bi-clock"></i> ${daysOld}d ago</div>
                </div>
                <div class="action-icons">
                    <button class="action-icon edit-lead-btn" data-id="${lead.id}" data-name="${escapeHtml(lead.name)}" data-phone="${lead.phone}" data-alt="${lead.alternate_phone || ''}" data-source="${lead.source || 'Google Adsense'}" data-status="${lead.status || 'New Lead'}" data-from="${lead.from_location || ''}" data-to="${lead.to_location || ''}" data-cost="${lead.cost_estimate || 0}" data-final="${lead.final_cost || 0}" data-advance="${lead.advance_paid || 0}" data-payment="${lead.payment_status || 'Pending'}" data-shifting="${lead.shifting_date || ''}" data-followup="${lead.followup_date || ''}" data-notes="${escapeHtml(lead.notes || '')}"><i class="bi bi-pencil-square"></i> Edit</button>
                    <button class="action-icon call-logger" data-id="${lead.id}" data-name="${escapeHtml(lead.name)}"><i class="bi bi-chat-text"></i> Log</button>
                    <button class="action-icon text-danger delete-lead-btn" data-id="${lead.id}"><i class="bi bi-trash3"></i> Del</button>
                </div>
            </div>
        `}).join('');
        
        attachEventListeners();
    }

    function attachEventListeners() {
        document.querySelectorAll('.edit-lead-btn').forEach(btn => {
            btn.removeEventListener('click', handleEditClick);
            btn.addEventListener('click', handleEditClick);
        });
        
        document.querySelectorAll('.call-logger').forEach(btn => {
            btn.removeEventListener('click', handleCallClick);
            btn.addEventListener('click', handleCallClick);
        });
        
        document.querySelectorAll('.delete-lead-btn').forEach(btn => {
            btn.removeEventListener('click', handleDeleteClick);
            btn.addEventListener('click', handleDeleteClick);
        });
    }
    
    async function handleDeleteClick(e) {
        e.preventDefault();
        e.stopPropagation();
        const id = e.currentTarget.dataset.id;
        
        if(confirm('Delete this lead permanently?')) {
            try {
                const res = await fetch(`/delete_lead/${id}`);
                if(res.ok) {
                    showToast('✓ Lead deleted successfully!', 'success');
                    // Auto-refresh will pick up the change in 0.1 seconds
                } else {
                    showToast('Failed to delete lead', 'error');
                }
            } catch(err) {
                showToast('Error deleting lead', 'error');
            }
        }
    }
    
    function handleEditClick(e) {
        e.stopPropagation();
        const btn = e.currentTarget;
        const id = parseInt(btn.dataset.id);
        
        let lead = leadsData.find(l => l.id === id);
        if(!lead) {
            lead = {
                id: id,
                name: btn.dataset.name,
                phone: btn.dataset.phone,
                alternate_phone: btn.dataset.alt,
                source: btn.dataset.source,
                status: btn.dataset.status,
                from_location: btn.dataset.from,
                to_location: btn.dataset.to,
                cost_estimate: btn.dataset.cost,
                final_cost: btn.dataset.final,
                advance_paid: btn.dataset.advance,
                payment_status: btn.dataset.payment,
                shifting_date: btn.dataset.shifting,
                followup_date: btn.dataset.followup,
                notes: btn.dataset.notes
            };
        }
        openEditModal(lead);
    }
    
    async function handleCallClick(e) {
        e.stopPropagation();
        const id = e.currentTarget.dataset.id;
        const name = e.currentTarget.dataset.name;
        const note = prompt(`Add notes for ${name}:`, "Discussed shifting details");
        if(note && note.trim()) {
            const formData = new URLSearchParams();
            formData.append('call_note', note);
            try {
                const res = await fetch(`/add_call_log/${id}`, { method: 'POST', body: formData });
                if(res.ok) {
                    showToast(`✓ Call log added for ${name}`, 'success');
                    // Auto-refresh will pick up the change
                } else {
                    showToast('Failed to save log', 'error');
                }
            } catch(err) {
                showToast('Error adding call log', 'error');
            }
        }
    }

    function openEditModal(lead) {
        document.getElementById('edit_lead_id').value = lead.id;
        document.getElementById('edit_name').value = lead.name || '';
        document.getElementById('edit_phone').value = lead.phone || '';
        document.getElementById('edit_alt_phone').value = lead.alternate_phone || '';
        document.getElementById('edit_source').value = lead.source || 'Google Adsense';
        document.getElementById('edit_status').value = lead.status || 'New Lead';
        document.getElementById('edit_cost').value = lead.cost_estimate || 0;
        document.getElementById('edit_final').value = lead.final_cost || 0;
        document.getElementById('edit_from').value = lead.from_location || '';
        document.getElementById('edit_to').value = lead.to_location || '';
        document.getElementById('edit_shifting_date').value = lead.shifting_date || '';
        document.getElementById('edit_followup').value = lead.followup_date || '';
        document.getElementById('edit_notes').value = lead.notes || '';
        
        const editModal = new bootstrap.Modal(document.getElementById('editModalGlobal'));
        editModal.show();
    }

    document.getElementById('editFormDynamic').addEventListener('submit', async (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        try {
            const res = await fetch(`/edit_lead/${formData.get('lead_id')}`, { method: 'POST', body: formData });
            if(res.ok) {
                showToast('✓ Lead updated successfully!', 'success');
                bootstrap.Modal.getInstance(document.getElementById('editModalGlobal')).hide();
                // Auto-refresh will pick up the change
            } else {
                const text = await res.text();
                if(text.includes("Duplicate")) showToast('⚠️ Duplicate phone number', 'error');
                else showToast('Update failed', 'error');
            }
        } catch(err) {
            showToast('Error updating lead', 'error');
        }
    });

    document.getElementById('addLeadForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        try {
            const res = await fetch('/add_lead', { method: 'POST', body: formData });
            if(res.ok) {
                showToast('✓ Lead added successfully!', 'success');
                bootstrap.Modal.getInstance(document.getElementById('addLeadModal')).hide();
                e.target.reset();
                // Auto-refresh will pick up the new lead
            } else {
                const text = await res.text();
                if(text.includes("Duplicate")) {
                    showToast('⚠️ Duplicate phone number!', 'error');
                } else {
                    showToast('Failed to add lead', 'error');
                }
            }
        } catch(err) {
            showToast('Error adding lead', 'error');
        }
    });

    function getStatusColor(status) {
        if(status.includes('Won')) return '#10b981';
        if(status.includes('Lost')) return '#ef4444';
        if(status.includes('Ready')) return '#3b82f6';
        if(status === 'New Lead') return '#f59e0b';
        return '#6b7280';
    }

    function escapeHtml(str) { 
        if(!str) return ''; 
        return str.replace(/[&<>]/g, function(m) {
            return m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;';
        });
    }

    // Calendar
    const fp = flatpickr('#calendarTrigger', {
        mode: "range",
        dateFormat: "d M",
        onChange: function(dates) {
            if(dates.length === 2) {
                dateRangeStart = dates[0];
                dateRangeEnd = dates[1];
                document.getElementById('calendarLabel').innerHTML = `${fp.formatDate(dateRangeStart, "d M")} - ${fp.formatDate(dateRangeEnd, "d M")}`;
                renderLeadsAndStats();
            } else if(dates.length === 1) {
                dateRangeStart = dates[0];
                dateRangeEnd = null;
                document.getElementById('calendarLabel').innerHTML = `${fp.formatDate(dateRangeStart, "d M")}+`;
                renderLeadsAndStats();
            } else {
                dateRangeStart = null;
                dateRangeEnd = null;
                document.getElementById('calendarLabel').innerHTML = "Date";
                renderLeadsAndStats();
            }
        }
    });

    document.getElementById('calendarTrigger').addEventListener('dblclick', () => {
        fp.clear();
        dateRangeStart = null;
        dateRangeEnd = null;
        document.getElementById('calendarLabel').innerHTML = "Date";
        renderLeadsAndStats();
    });

    document.getElementById('globalSearch').addEventListener('input', (e) => { 
        searchTerm = e.target.value; 
        renderLeadsAndStats(); 
    });
    
    document.getElementById('statusFilterGlobal').addEventListener('change', (e) => { 
        statusFilter = e.target.value; 
        renderLeadsAndStats(); 
    });
    
    // Start auto-refresh on page load
    startAutoRefresh();

    // Initial load
    autoRefresh();

    // Optional: Stop auto-refresh when page is hidden (saves resources)
    document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
            stopAutoRefresh();
        } else {
            startAutoRefresh();
            autoRefresh(); // Immediate refresh when page becomes visible
        }
    });

    {% if leads %}
    window.initialLeads = {{ leads | tojson | safe }};
    setTimeout(() => {
        if(leadsData.length === 0 && window.initialLeads) {
            leadsData = window.initialLeads.sort((a,b)=> new Date(b.created_at) - new Date(a.created_at));
            renderLeadsAndStats();
        }
    }, 100);
    {% endif %}
</script>
</body>
</html>
